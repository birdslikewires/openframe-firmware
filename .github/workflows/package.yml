name: package-build-publish
run-name: package build and publish

# Builds the openframe-firmware package from the latest GitHub Release's images and publishes it
# to the apt repository on the repo branch (firmware.openbeak.net). The package carries the
# images (OpenFrame 1, and OpenFrame 2 when the release has one), of-firmware-update and its manifest, and of-firmware.service, which updates the chip at
# the next boot. It is built from the published images themselves, checked against releases/MD5SUMS,
# and only after of-firmware-update has passed its fake-chip tests against them, and
# of-firmware-boot its own.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'tools/of-firmware-update'
      - 'tools/fwplan.py'
      - 'tools/firmware-manifest.txt'
      - 'tools/test_of_firmware_update.sh'
      - 'package/**'
      - 'releases/MD5SUMS'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # the testing issue (ci/testing-issue.sh)

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the package revision counts commits since the release

      - name: Install tools
        run: sudo apt-get install -y apt-utils dpkg-dev

      # Version: the release, then a revision counting the commits since its tag that changed
      # what the package holds (26.11.29-1, -2, ...).
      # The OpenFrame 1 image is always there; the OpenFrame 2's from 26.11.32 (IMG2 empty before).
      - name: Fetch the release images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          ASSETS=$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          IMG2=
          for M in 1 2; do
            F="of${M}-blw-${TAG}.bin"
            if [ "${M}" = 2 ] && ! echo "${ASSETS}" | grep -qx "${F}"; then
              echo "${TAG} has no OpenFrame 2 image: packaging the OpenFrame 1's only"; continue
            fi
            gh release download "${TAG}" --repo "${{ github.repository }}" -p "${F}" -D work
            WANT=$(awk -v f="${F}" '$2 == f { print $1 }' releases/MD5SUMS)
            GOT=$(md5sum "work/${F}" | cut -d' ' -f1)
            [ -n "${WANT}" ] && [ "${WANT}" = "${GOT}" ] || { echo "work/${F}: md5 ${GOT}, releases/MD5SUMS says '${WANT}'"; exit 1; }
            echo "${F}: md5 ${GOT}"
            if [ "${M}" = 1 ]; then IMG="work/${F}"; else IMG2="work/${F}"; fi
          done
          git fetch --tags --quiet
          REV=$(( $(git rev-list --count "${TAG}..HEAD" -- tools/of-firmware-update tools/fwplan.py tools/firmware-manifest.txt package) + 1 ))
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "IMG=${IMG}" >> $GITHUB_ENV
          echo "IMG2=${IMG2}" >> $GITHUB_ENV
          echo "VERSION=${TAG}-${REV}" >> $GITHUB_ENV
          echo "Release ${TAG}, package version ${TAG}-${REV}"

      # From 26.11.31 the updater writes only blocks 9-11, in the block-11 layout
      # (docs/flash-order.md), and refuses an image of the old layout: so no package until the
      # latest release is of that layout, or units would get an updater that refuses its image.
      # The manifest names an OpenFrame 2 release of2-<tag>.
      - name: Check the release is of the block-11 layout
        run: |
          for P in "${IMG}:${TAG}" ${IMG2:+"${IMG2}:of2-${TAG}"}; do
          I=${P%%:*}; L=${P#*:}
          OUT=$(python3 -I tools/fwplan.py canon "${I}" work/canon.bin) || { echo "${OUT}"; exit 1; }
          case "${OUT}" in *"layout=block11"*) echo "${L}: ${OUT}" ;;
            *) echo "${L} is not of the block-11 layout (${OUT}): not packaging"; exit 1 ;; esac
          python3 -I - "${I}" tools/firmware-manifest.txt "${L}" <<'EOF'
          import hashlib, sys
          sys.path.insert(0, 'tools')
          import fwplan
          img = fwplan.canon(open(sys.argv[1], 'rb').read())[0]
          have = {(int(n), h): l.split(',') for n, h, l in (x.split() for x in open(sys.argv[2]) if x[0] != '#')}
          for n in range(1, 16):
              k = (n, hashlib.md5(img[n * 65536:(n + 1) * 65536]).hexdigest())
              if sys.argv[3] not in have.get(k, []):
                  sys.exit('tools/firmware-manifest.txt does not list block %d of %s (mkmanifest.py)' % (n, sys.argv[3]))
          EOF
          done

      # The updater against fake chips: from each stock firmware (the openbeak.net collection,
      # checked against its md5s) to this release, with power cuts and failing writes.
      - name: Test of-firmware-update
        run: |
          T=work/test; mkdir -p "${T}"
          cp tools/of-firmware-update tools/fwplan.py tools/mkmanifest.py "${T}/"
          cp "${IMG}" "${T}/release.bin"
          E=https://openbeak.net/openframe/firmware/efi
          get() { curl -fsSL --retry 3 -o "${T}/$2" "$E/$1"; echo "$3  ${T}/$2" | md5sum -c --quiet; }
          get of1_efi_o2.img o2-stock.bin eeb32d85e8b8c63ccc00429e083a88b8
          get of1_efi_openpeak_verizon.img verizon.bin dbfeeb9e7e943ee0c46986995d4b383c
          get of1_efi_telstra.img telstra.bin 8903c18f882cbde3b98c793f7e827a40
          get untested/op1.rom op1.rom 7fde2784f48486570e7c5927c2a9b71e
          get of2_efi_cisco.img of2-cisco.bin 07a8fb52aedbf967cbcb1f2acc837d87
          if [ -n "${IMG2}" ]; then
            cp "${IMG2}" "${T}/of2-release.bin"
            get of2_efi_telio.img of2-telio.bin 188c50384cb4ec378cdd3f82812d6276
            get of2_efi_avaya.img of2-avaya.bin ed07b4fc492eeeae7ec9dd0dc1350baf
            get of2_openpeak.img of2-openpeak.bin c35f7e01052a3d2323610d7688244e9b
            get do_not_use/of2_efi_swisscom/of2_efi_swisscom.img of2-swisscom.bin eb1ca17b0a3166e020784fc806dfc54f
          fi
          sudo bash tools/test_of_firmware_update.sh "${T}"

      # The boot-time update (of-firmware-boot) against a stand-in updater: what it does after
      # each try, never letting the boot carry on once one hasn't verified, and the updater's
      # dumps kept from filling /tmp.
      # (Not a trigger: it isn't in the package's revision, so a change to it alone would
      # rebuild the version units already have.)
      - name: Test of-firmware-boot
        run: bash tools/test_of_firmware_boot.sh

      - name: Build the package
        run: |
          PKG="work/openframe-firmware_${VERSION}_all"
          L="${PKG}/usr/lib/openframe-firmware"
          mkdir -p "${PKG}/DEBIAN" "${L}" "${PKG}/usr/local/sbin" "${PKG}/usr/lib/systemd/system"
          install -m 644 "${IMG}" "${L}/of1-blw.bin"
          (cd "${L}" && md5sum of1-blw.bin > of1-blw.bin.md5 && chmod 644 of1-blw.bin.md5)
          if [ -n "${IMG2}" ]; then
            install -m 644 "${IMG2}" "${L}/of2-blw.bin"
            (cd "${L}" && md5sum of2-blw.bin > of2-blw.bin.md5 && chmod 644 of2-blw.bin.md5)
            FOR="OpenFrame 1 and 2"
            FROM="stock O2, Verizon or Telstra firmware on an OpenFrame 1, stock Cisco,\n Telio, Avaya or OpenPeak firmware on an OpenFrame 2, or an earlier release,"
          else
            FOR="OpenFrame 1"
            FROM="stock O2, Verizon or Telstra firmware, or an earlier release,"
          fi
          install -m 644 tools/firmware-manifest.txt "${L}/manifest.txt"
          install -m 644 tools/fwplan.py "${L}/fwplan.py"
          install -m 755 package/of-firmware-boot "${L}/of-firmware-boot"
          install -m 755 tools/of-firmware-update "${PKG}/usr/local/sbin/of-firmware-update"
          install -m 644 package/of-firmware.service "${PKG}/usr/lib/systemd/system/of-firmware.service"
          install -D -m 755 package/of-firmware-generator "${PKG}/usr/lib/systemd/system-generators/of-firmware-generator"
          install -m 755 package/postinst package/prerm "${PKG}/DEBIAN/"
          find "${PKG}" -type d -exec chmod 755 {} +
          printf 'Package: openframe-firmware\nVersion: %s\nArchitecture: all\nSection: admin\nPriority: optional\nMaintainer: OpenFrame Project <noreply@openbeak.net>\nDepends: bash, coreutils, kmod, python3, systemd\nHomepage: https://github.com/birdslikewires/openframe-firmware\nDescription: BirdsLikeWires firmware for the %s (%s)\n The %s EFI firmware release %s, and\n of-firmware-update, which brings the chip to it\n from %b\n at the next boot (of-firmware.service), in an order where a power\n cut at any point leaves a chip that starts. Firmware it does not\n recognise is left alone.\n' \
            "${VERSION}" "${FOR}" "${TAG}" "${FOR}" "${TAG}" "${FROM}" > "${PKG}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG}"
          dpkg-deb --info "${PKG}.deb" | sed -n '1,20p'
          dpkg-deb --contents "${PKG}.deb"
          echo "DEB=${PKG}.deb" >> $GITHUB_ENV

      - name: Ensure repo branch exists
        run: |
          git fetch origin repo:refs/remotes/origin/repo 2>/dev/null || {
            git checkout --orphan repo-init && git rm -rfq . &&
            echo firmware.openbeak.net > CNAME && git add CNAME &&
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -qm "apt repository" && git push origin repo-init:repo && git checkout -q "${GITHUB_SHA}"; }

      - name: Checkout repo branch
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      # Every OpenFrame apt repository is signed with one key; anything else stops here.
      - name: Import GPG signing key
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY_OPENFRAME }}
        run: |
          echo "${KEY}" | gpg --batch --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
          [ "${FPR}" = 179C4F02E55F4096D690F3BFED801B683FCE8553 ] || { echo "Signing key ${FPR} is not the OpenFrame apt key"; exit 1; }
          echo "GPG_KEY_ID=${FPR}" >> $GITHUB_ENV

      # ci/apt-suite.sh, tested before it's used: a publish reaches test units only.
      - name: Test the testing and released suites
        run: bash tests/test_apt_suite.sh

      # To the testing suite: test units take it now, every other OpenFrame once it's promoted
      # ("ok" in reply to the testing issue, promote.yml). Firmware is flashed at the restart after
      # it's installed, so test units are the ones to flash it first.
      - name: Update apt repository
        env:
          APT_NAME: OpenFrame Firmware
        run: |
          export SIGN_ARGS="--local-user ${GPG_KEY_ID}!"
          bash ci/apt-suite.sh add trixie-testing "${DEB}"
          gpg --export "${GPG_KEY_ID}" > apt-repo/key.gpg
          echo firmware.openbeak.net > apt-repo/CNAME
          bash ci/apt-suite.sh listing

      - name: Push apt repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "apt: openframe-firmware ${VERSION} ($(git -C .. rev-parse --short HEAD)), testing"
          git push origin repo

      - name: Update the testing issue
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.TESTING_ASSIGNEE || 'andydvsn' }}   # who's told (an organisation can't be)
          APT_NAME: OpenFrame Firmware
        run: bash ci/testing-issue.sh "openframe-firmware ${VERSION} is in testing."
